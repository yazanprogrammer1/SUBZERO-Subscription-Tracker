# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build performance: configuration cache + parallel + caching are safe with our plugin set.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX (required). Jetifier is off: we have no support-library dependencies.
android.useAndroidx=true
android.enableJetifier=false

# Only generate R classes for a module's own resources (faster builds, explicit deps).
android.nonTransitiveRClass=true

# Kotlin: compile all modules with the same language settings. Warnings are treated
# as errors in CI via -PwarningsAsErrors=true (see build-logic).
kotlin.code.style=official
