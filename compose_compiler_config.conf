// Classes the Compose compiler should treat as stable even though it cannot prove it.
// java.time types are immutable; without this every composable taking a LocalDate would be
// treated as unstable and recompose unnecessarily.
java.time.LocalDate
java.time.Instant
java.time.YearMonth
java.util.Currency
java.time.Clock
java.math.BigDecimal
// Domain models are immutable data classes in a pure-JVM module that cannot see @Immutable.
com.subzero.core.domain.model.*
com.subzero.core.domain.insight.*
com.subzero.core.domain.usecase.*
